# The shape of aioc-secrets, with no values. Never commit a filled copy; create the
# secret from a local env file instead:
#   kubectl -n aioc create secret generic aioc-secrets --from-env-file=<file>
apiVersion: v1
kind: Secret
metadata:
  name: aioc-secrets
  namespace: aioc
type: Opaque
stringData:
  DATABASE_URL: ""        # postgresql://... a Postgres with the vector extension available
  AIOC_API_TOKEN: ""      # the bearer token; blank keeps the service closed
  ANTHROPIC_API_KEY: ""   # live requests only
  VOYAGE_API_KEY: ""      # optional; without it retrieval is lexical-only, and says so
  LANGFUSE_PUBLIC_KEY: "" # optional; without both keys there are no traces
  LANGFUSE_SECRET_KEY: ""
  GITHUB_TOKEN: ""        # read-only, fine-grained; the GitHub and Deployment agents
  GITHUB_REPO: ""         # owner/name
