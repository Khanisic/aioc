# Claude Code on pull requests (CCA-F Domain 3, the workflow half), on request only.
#
# Two jobs, each started by adding a label to a PR, never by a push:
#   claude-review  reads the change and posts inline comments on the lines it finds a
#                  defect in, plus one summary. Read-only: it cannot push or run anything.
#   claude-tests   writes tests for the change and runs the offline suite; a workflow step,
#                  not the model, pushes the commit, and only if it touches tests/ alone.
# Re-add the label to run a job again. Labels rather than pushes because each run costs
# usage, and a review nobody asked for is the one nobody reads.
#
# Authentication is a Claude subscription token, not API credit (the project's $0 rule,
# HANDOFF sec 1): `claude setup-token` prints one, stored as the CLAUDE_CODE_OAUTH_TOKEN
# repository secret. The Claude GitHub App (https://github.com/apps/claude) posts the
# comments. Without the token a job is skipped with a warning, never failed.
#
# The review's instructions live in .github/claude/review.md, the same file the prompt is
# tuned against locally (docs/design-notes/review-prompt-tuning.md), so what is measured
# is what runs.
name: claude

on:
  pull_request:
    types: [labeled]

concurrency:
  group: claude-${{ github.event.label.name }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.label.name == 'claude-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      # A job-level `if` cannot read secrets, so the check is a step.
      - name: Check for the subscription token
        id: auth
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; the Claude review was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.auth.outputs.present == 'true'
        with:
          fetch-depth: 1

      - name: Read the review instructions
        if: steps.auth.outputs.present == 'true'
        id: prompt
        run: |
          {
            echo "text<<PROMPT_EOF"
            cat .github/claude/review.md
            echo "PROMPT_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Read,Grep,Glob,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            Get the change with `gh pr diff ${{ github.event.pull_request.number }}`.

            ${{ steps.prompt.outputs.text }}

            Post each finding with mcp__github_inline_comment__create_inline_comment on the
            line it is about. Then post one top-level summary with `gh pr comment`: the
            number of findings, or "No defects found." and one line on what you checked.

  tests:
    if: github.event.label.name == 'claude-tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Check for the subscription token
        id: auth
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::CLAUDE_CODE_OAUTH_TOKEN is not set; test generation was skipped."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      # The PR's own branch, not the merge ref, so a commit lands where the author sees it.
      - uses: actions/checkout@v7
        if: steps.auth.outputs.present == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.auth.outputs.present == 'true'
        with:
          enable-cache: true

      - name: Install
        if: steps.auth.outputs.present == 'true'
        run: uv sync --all-groups --locked

      - uses: anthropics/claude-code-action@v1
        if: steps.auth.outputs.present == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(gh pr diff:*),Bash(uv run pytest:*),Bash(uv run ruff:*),Bash(git status:*),Bash(git diff:*),Bash(git add:*),Bash(git commit:*),Bash(gh pr comment:*)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BRANCH: ${{ github.event.pull_request.head.ref }}

            Write tests for the behaviour this pull request adds or changes in AIOC.
            Read CLAUDE.md and .claude/rules/tests.md first, then `gh pr diff`.

            - Test behaviour the change introduces that no existing test covers. Read the
              test file for the changed module first; do not duplicate what is there.
            - Follow the file's own style: its fakes, its helpers, its naming. Every scripted
              fake client must call `tests.wire.check_conversation` on what it is sent.
            - Tests must be offline: no network, no API key, nothing that needs the Docker
              stack unless marked `integration`. A test that would reach the network is wrong.
            - A contract invariant gets a negative test that the violation is rejected.
            - Change only files under tests/. If a test fails because the code is wrong, do
              not change the code and do not weaken the test: leave it out and say so.

            Run `uv run pytest -q -m "not integration"` and `uv run ruff check tests`
            until both pass. Then `git add` the test files and commit with the message
            "Tests for #${{ github.event.pull_request.number }}, generated by Claude Code".
            Do not push; the workflow pushes after checking the commit.
            Finish with one `gh pr comment`: what the new tests cover, and any behaviour
            you found broken and left untested. If the change needs no new tests, commit
            nothing and say why.

      # The boundary is enforced here, not in the prompt: the commit is pushed only when
      # every file it changes is under tests/ and the offline suite passes on it.
      - name: Push the tests, if they are only tests
        if: steps.auth.outputs.present == 'true'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          changed=$(git diff --name-only "origin/$BRANCH" HEAD)
          if [ -z "$changed" ]; then
            echo "No new commit; nothing to push."
            exit 0
          fi
          outside=$(echo "$changed" | grep -v '^tests/' || true)
          if [ -n "$outside" ]; then
            echo "::error::The generated commit changes files outside tests/:"
            echo "$outside"
            exit 1
          fi
          uv run pytest -q -m "not integration"
          git push origin "HEAD:$BRANCH"
